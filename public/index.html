<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#050506">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Lo-fi — «Моя волна», подборки под настроение и плеер с караоке.">
  <title>Lo-fi</title>
  <link rel="icon" href="/media/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/js/boot.js"></script>
  <link rel="stylesheet" href="/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="rail" aria-label="Навигация">
      <a class="brand" href="/" data-link aria-label="Lo-fi — на главную">
        <span class="brand-mark"><svg class="i"><use href="#i-logo"/></svg></span>
        <span class="brand-word">Lo-fi</span>
      </a>
      <nav class="rail-nav">
        <a class="nav-link" href="/" data-link data-nav="home"><svg class="i"><use href="#i-home"/></svg><span>Главная</span></a>
        <a class="nav-link" href="/search" data-link data-nav="search"><svg class="i"><use href="#i-search"/></svg><span>Поиск</span></a>
        <a class="nav-link" href="/library" data-link data-nav="library"><svg class="i"><use href="#i-library"/></svg><span>Медиатека</span></a>
      </nav>
      <button class="rail-wave" type="button" data-action="wave-toggle">
        <span class="rail-wave-orb" aria-hidden="true"><canvas width="88" height="88"></canvas></span>
        <span class="rail-wave-text"><strong>Моя волна</strong><small data-wave-status>Включить</small></span>
      </button>
      <div class="rail-foot">
        <a class="nav-link" href="/settings" data-link data-nav="settings"><svg class="i"><use href="#i-settings"/></svg><span>Настройки</span></a>
        <button class="nav-link theme-switch" type="button" data-action="theme-cycle"><svg class="i"><use href="#i-system"/></svg><span>Тема</span></button>
        <div class="profile" id="profile" hidden></div>
      </div>
    </aside>

    <div class="stage">
      <header class="topbar" id="topbar">
        <div class="topbar-nav">
          <button class="icon-btn ghost" type="button" data-action="history-back" aria-label="Назад" title="Назад"><svg class="i"><use href="#i-back"/></svg></button>
          <a class="brand compact" href="/" data-link aria-label="Lo-fi — на главную">
            <span class="brand-mark"><svg class="i"><use href="#i-logo"/></svg></span>
            <span class="brand-word">Lo-fi</span>
          </a>
        </div>
        <form class="searchbar" id="searchbar" role="search" autocomplete="off">
          <svg class="i"><use href="#i-search"/></svg>
          <input id="search-input" type="search" enterkeyhint="search" placeholder="Трек, артист или ссылка" maxlength="220" aria-label="Поиск">
          <kbd aria-hidden="true">/</kbd>
          <button class="icon-btn ghost sm" type="button" data-action="search-clear" aria-label="Очистить" hidden><svg class="i"><use href="#i-close"/></svg></button>
        </form>
        <div class="topbar-actions">
          <button class="icon-btn ghost" type="button" data-action="theme-cycle" aria-label="Тема"><svg class="i"><use href="#i-system"/></svg></button>
          <button class="icon-btn ghost" type="button" id="fullscreen-btn" data-action="fullscreen" aria-label="На весь экран" hidden><svg class="i"><use href="#i-expand"/></svg></button>
        </div>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <section class="dock glass" id="dock" aria-label="Мини-плеер" data-empty="true">
    <div class="dock-progress" aria-hidden="true"><i></i></div>
    <button class="dock-now" type="button" data-action="player-open" aria-label="Открыть плеер">
      <span class="cover dock-cover" id="dock-cover"></span>
      <span class="dock-meta">
        <strong id="dock-title">Ничего не играет</strong>
        <small id="dock-artist">Включите «Мою волну»</small>
      </span>
    </button>
    <div class="dock-controls">
      <button class="icon-btn ghost dock-like" type="button" data-action="like-current" aria-label="В избранное" disabled><svg class="i"><use href="#i-heart"/></svg></button>
      <button class="icon-btn ghost wide-only" type="button" data-action="shuffle" aria-label="Перемешать" aria-pressed="false"><svg class="i"><use href="#i-shuffle"/></svg></button>
      <button class="icon-btn ghost wide-only" type="button" data-action="prev" aria-label="Предыдущий"><svg class="i"><use href="#i-prev"/></svg></button>
      <button class="play-btn" type="button" data-action="toggle" aria-label="Играть"><svg class="i"><use href="#i-play"/></svg><span class="spinner" aria-hidden="true"></span></button>
      <button class="icon-btn ghost" type="button" data-action="next" aria-label="Следующий"><svg class="i"><use href="#i-next"/></svg></button>
      <button class="icon-btn ghost wide-only" type="button" data-action="repeat" aria-label="Повтор" aria-pressed="false"><svg class="i"><use href="#i-repeat"/></svg></button>
    </div>
    <div class="dock-timeline wide-only">
      <time data-time="pos">0:00</time>
      <div class="slider seek" data-slider="seek" role="slider" aria-label="Позиция" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="slider-track"><i class="slider-fill"></i></span><span class="slider-thumb"></span></div>
      <time data-time="dur">0:00</time>
    </div>
    <div class="dock-extra wide-only">
      <button class="icon-btn ghost" type="button" data-action="player-lyrics" aria-label="Текст песни" title="Текст песни"><svg class="i"><use href="#i-lyrics"/></svg></button>
      <button class="icon-btn ghost" type="button" data-action="player-queue" aria-label="Очередь" title="Очередь"><svg class="i"><use href="#i-queue"/></svg></button>
      <button class="icon-btn ghost" type="button" data-action="mute" aria-label="Звук"><svg class="i"><use href="#i-volume"/></svg></button>
      <div class="slider volume" data-slider="volume" role="slider" aria-label="Громкость" tabindex="0" aria-valuemin="0" aria-valuemax="100"><span class="slider-track"><i class="slider-fill"></i></span><span class="slider-thumb"></span></div>
    </div>
  </section>

  <nav class="tabbar glass" aria-label="Разделы">
    <a class="tab" href="/" data-link data-nav="home"><svg class="i"><use href="#i-home"/></svg><span>Главная</span></a>
    <a class="tab" href="/search" data-link data-nav="search"><svg class="i"><use href="#i-search"/></svg><span>Поиск</span></a>
    <a class="tab" href="/library" data-link data-nav="library"><svg class="i"><use href="#i-library"/></svg><span>Медиатека</span></a>
    <a class="tab" href="/settings" data-link data-nav="settings"><svg class="i"><use href="#i-settings"/></svg><span>Настройки</span></a>
  </nav>

  <dialog class="player" id="player" aria-label="Плеер"></dialog>
  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>
  <div class="popover" id="popover" role="menu" popover="manual"></div>
  <div class="toasts" id="toasts" aria-live="polite" popover="manual"></div>
  <div class="widget-slot" id="widget-slot" aria-hidden="true"></div>
  <noscript><p class="noscript">Для работы Lo-fi нужен JavaScript.</p></noscript>
</body>
</html>
